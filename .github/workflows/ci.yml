# =============================================================================
# CI - Multi-Institution SaaS Platform
#
# TRIGGERS:
#   - `push` to `main` runs the full pipeline automatically.
#   - `workflow_dispatch` runs it by hand from the GitHub UI (or the API/CLI),
#     with the version inputs below as a form.
#
# JOBS: tests (Pest/PHPUnit) | dusk (headless-Chrome browser tests) |
#       build-assets (Vite) | migrations (tenant-schema verification).
# =============================================================================

name: CI
on:
  # Runs automatically whenever code is pushed to the 'main' branch
  push:
    branches:
      - main
  # ---------------------------------------------------------------------------
  # MANUAL TRIGGER.
  #
  # `workflow_dispatch` is the GitHub event for "run this by hand". Its `inputs`
  # below become a form in the Actions tab, so a manual run can be parameterised
  # without editing the file.
  # ---------------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to test against'
        required: false
        default: '8.2'
        type: choice
        options:
          - '8.2'
          - '8.3'
      node_version:
        description: 'Node.js version for the Vite build'
        required: false
        default: '20'
        type: choice
        options:
          - '20'
          - '22'

# Least-privilege default for the whole workflow. The pipeline only needs to
# read the checked-out repo; no job writes back to it.
permissions:
  contents: read

# Cancel an in-flight run if the same branch is manually re-triggered - manual
# runs are deliberate, so a newer one supersedes an older, still-running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # JOB 1 - PHP static analysis + test suite (Pest/PHPUnit, SQLite in-memory)
  # ===========================================================================
  tests:
    name: Tests (PHP ${{ github.event.inputs.php_version || '8.2' }})
    runs-on: ubuntu-latest

    # The PHP version comes from the manual-trigger form, falling back to 8.2.
    env:
      PHP_VERSION: ${{ github.event.inputs.php_version || '8.2' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # PHP + Composer setup with dependency caching.
      #
      # `shivammathur/setup-php` installs PHP, Composer and the extensions below.
      # We add sqlite3 + pdo_sqlite explicitly because the entire test suite and
      # the migration check run on SQLite.
      # -----------------------------------------------------------------------
      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, gd
          coverage: none          # Coverage is a separate concern; skip the driver cost.

      # -----------------------------------------------------------------------
      # COMPOSER CACHE.
      #
      # WHY: `composer install` resolves the full dependency graph against
      # packagist. Caching Composer's download cache means unchanged packages are
      # restored from the cache instead of re-downloaded - typically cutting this
      # step from ~40s to a few seconds.
      #
      # KEY: hashed on `composer.lock`, so the cache is INVALIDATED the instant a
      # dependency changes - never a stale lockfile, never a wrong package.
      #
      # This caches the DOWNLOAD ARTIFACTS (the Composer home cache), not the
      # vendor/ directory: the install step still runs every time, so a
      # corrupted cache can never masquerade as a correct install.
      # -----------------------------------------------------------------------
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        # `composer.lock` is committed, so this is a DETERMINISTIC install:
        # `composer install` honours the lock exactly; it never upgrades.

      - name: Prepare the application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Compliant coding style (Laravel Pint)
        # Fails the build on style violations so reviews focus on logic, not
        # formatting. `--test` checks WITHOUT writing, leaving the tree clean.
        run: composer run phpcs

      # -----------------------------------------------------------------------
      # RUN THE TEST SUITE.
      #
      # phpunit.xml already pins the test environment (APP_ENV=testing,
      # DB_CONNECTION=sqlite, DB_DATABASE=:memory:, MAIL_MAILER=array,
      # SESSION_DRIVER=array, QUEUE_CONNECTION=sync). So tests are hermetic: no
      # real database, no outbound mail, no shared state between runs.
      #
      # `composer test` runs `config:clear` first - important because Laravel
      # caches config, and a stale cache would make the suite run against the
      # WRONG (non-testing) environment.
      # -----------------------------------------------------------------------
      - name: Run test suite (Pest/PHPUnit)
        run: composer test
      # -----------------------------------------------------------------------
      # TENANT-ISOLATION & PERMISSION FOCUSED RUN.
      #
      # The guardrails require explicit, named coverage of the multi-tenant data
      # boundary and role-based access. `--filter` targets those test classes;
      # `--fail-on-empty` guarantees a rename that drops coverage FAILS the build
      # rather than silently passing zero tests.
      # -----------------------------------------------------------------------
      - name: Tenant isolation & permission tests
        run: |
          php artisan test \
            --filter='RegistrationTest|SuperAdminPasswordGuardTest|ProfileTest' \
            --fail-on-empty

  # ===========================================================================
  # JOB 2 - Laravel Dusk browser tests (headless Chrome)
  #
  # RAN IN ITS OWN JOB ON PURPOSE. Dusk is not a normal PHPUnit run: it drives a
  # REAL headless Chrome against a REAL `php artisan serve` process, so it needs
  # the frontend assets built, a file-backed SQLite database shared by both the
  # test process and the server process, and a browser driver. Bundling all of
  # that into the `tests` job would slow the fast unit/feature run and muddy a
  # failure. Keeping it separate means a broken browser test is unambiguous.
  #
  # It depends on `tests` so the cheap, fast suite fails first without burning a
  # browser download + Chrome run.
  # ===========================================================================
  dusk:
    name: Browser tests (Dusk)
    runs-on: ubuntu-latest
    needs: tests
    env:
      PHP_VERSION: ${{ github.event.inputs.php_version || '8.2' }}
      NODE_VERSION: ${{ github.event.inputs.node_version || '20' }}
      # The app server the browser talks to. Dusk reads this same URL via
      # APP_URL in .env.dusk below, so the two must agree.
      APP_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # -----------------------------------------------------------------------
      # PHP + SQLite (Dusk's file-backed test DB lives on disk).
      # -----------------------------------------------------------------------
      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, gd
          coverage: none
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      # -----------------------------------------------------------------------
      # Frontend assets the Inertia pages need.
      #
      # Dusk drives real pages, so the Vite manifest MUST exist. We build the
      # production bundle (NOT the dev server): with no `public/hot` file, the
      # @vite directive serves from the compiled manifest - exactly what a real
      # deployment looks like.
      # -----------------------------------------------------------------------
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci
      - name: Build production assets
        run: npm run build
      # -----------------------------------------------------------------------
      # Headless Chrome + matching ChromeDriver.
      #
      # ubuntu-latest ships google-chrome; `dusk:chrome-driver --detect` installs
      # the chromedriver build that MATCHES the installed Chrome version, so the
      # pair never drifts (a mismatched driver is the usual CI Dusk failure).
      # -----------------------------------------------------------------------
      - name: Install the matching ChromeDriver
        run: php artisan dusk:chrome-driver --detect
      # -----------------------------------------------------------------------
      # Dusk environment file.
      #
      # `php artisan dusk` backs up `.env` and copies `.env.dusk` over it, so the
      # browser run gets its OWN environment. We write it here rather than
      # committing secrets: a file-backed SQLite DB, a real (file) session driver
      # the server process can read, and the app pointed at the served URL.
      # -----------------------------------------------------------------------
      - name: Write the Dusk environment file
        run: |
          # Generate a key and embed it DIRECTLY in .env.dusk: `artisan dusk`
          # copies .env.dusk OVER .env, so a key written to .env would be
          # discarded and the browser run would boot with an empty APP_KEY.
          APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          cat > .env.dusk <<EOF
          APP_NAME=Laravel
          APP_ENV=local
          APP_KEY=${APP_KEY}
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:8000
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          BCRYPT_ROUNDS=4
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=sqlite
          DB_DATABASE=database/dusk.sqlite
          SESSION_DRIVER=file
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=array
          MAIL_MAILER=array
          REGISTRATION_DEFAULT_ROLE=Member
          VITE_APP_NAME="Laravel"
          EOF
      # -----------------------------------------------------------------------
      # Seed the file-backed Dusk database.
      #
      # DuskDatabase migrates this file and commits every insert so the SEPARATE
      # serve process can see the same rows. We touch the file here so the very
      # first request has a database to open.
      # -----------------------------------------------------------------------
      - name: Create the Dusk SQLite database
        run: |
          mkdir -p database
          touch database/dusk.sqlite
      # -----------------------------------------------------------------------
      # Start the app server the browser drives.
      #
      # Dusk does NOT start `php artisan serve` for us; the tests assume a server
      # is already listening on APP_URL. Launch it in the background and BLOCK
      # until it answers, so the first test never races a booting server.
      # -----------------------------------------------------------------------
      - name: Start the application server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/up > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start; last output:"
          cat /tmp/serve.log
          exit 1
      # -----------------------------------------------------------------------
      # RUN DUSK.
      #
      # `php artisan dusk` uses phpunit.dusk.xml (testsuite = ./tests/Browser).
      # Any failing test or assertion exits non-zero, so the job fails loudly.
      # -----------------------------------------------------------------------
      - name: Run Dusk browser tests
        run: php artisan dusk
      # -----------------------------------------------------------------------
      # TEARDOWN / DIAGNOSTICS.
      #
      # `if: always()` so the server log is captured even when Dusk fails - and
      # the server is killed so a hung process never blocks the runner. Screenshots
      # and console logs from failures are uploaded for debugging.
      # -----------------------------------------------------------------------
      - name: Stop the application server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
      - name: Show the application server log
        if: failure()
        run: cat /tmp/serve.log || true
      - name: Upload Dusk screenshots and console logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-failure-artifacts
          path: |
            tests/Browser/screenshots
            tests/Browser/console
          if-no-files-found: ignore
          retention-days: 7
  # ===========================================================================
  # JOB 3 - Frontend build (React / Inertia / Vite)
  # ===========================================================================
  build-assets:
    name: Build assets (Vite)
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: ${{ github.event.inputs.node_version || '20' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # -----------------------------------------------------------------
          # NODE CACHE - built into setup-node.
          #
          # WHY: npm re-downloads the whole dependency tree on a cold runner.
          # setup-node's cache restores the global npm cache, so `npm ci` mostly
          # unpacks rather than downloads.
          #
          # KEY: keyed on package-lock.json -> invalidated exactly when a
          # dependency changes.
          # -----------------------------------------------------------------
          cache: 'npm'

      # -----------------------------------------------------------------------
      # `npm ci` (NOT `npm install`).
      #
      # `npm ci` installs EXACTLY what package-lock.json specifies and refuses to
      # run if the lock and package.json disagree - the deterministic,
      # reproducible install the guardrails require. It is also faster than
      # `npm install` because it skips resolution.
      # -----------------------------------------------------------------------
      - name: Install Node dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      # The build must actually emit a manifest; a silent no-op would break every
      # Inertia page at runtime. Assert the artifact exists.
      - name: Verify the Vite build manifest exists
        run: test -f public/build/manifest.json && echo "Vite manifest present."

  # ===========================================================================
  # JOB 4 - Tenant-scoped migration verification on a REAL SQLite file
  # ===========================================================================
  migrations: 
    name: Migration & tenant-schema verification (SQLite)
    runs-on: ubuntu-latest
    needs: tests          # Only check migrations once the code is known-good.

    env:
      PHP_VERSION: ${{ github.event.inputs.php_version || '8.2' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # -----------------------------------------------------------------------
      # MIGRATION VERIFICATION ON A FILE-BACKED SQLITE DB.
      #
      # The test suite uses `:memory:` (fast, hermetic, thrown away per run).
      # This job is different ON PURPOSE: it migrates a real .sqlite FILE from
      # scratch. That proves the migration set is valid as a DEPLOYABLE artifact
      # - the in-memory run alone cannot catch a migration that only works when
      # the connection is recreated between tests.
      #
      # Reason: the guardrails call for "tenant-scoped database migration
      # verification". `migrate:fresh --seed` builds the full schema AND the
      # tenant/role seed data, then we assert the tenant boundary survives it.
      #
      # The DB file is created in the runner's workspace and is NEVER committed:
      # database/*.sqlite is gitignored (see .gitignore) and exists only here.
      # -----------------------------------------------------------------------
      - name: Create a clean SQLite database file
        run: |
          mkdir -p database
          touch database/database.sqlite
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> "$GITHUB_ENV"

      - name: Run migrations from scratch (with seed data)
        env:
          DB_CONNECTION: sqlite
        run: php artisan migrate:fresh --seed --force

      # -----------------------------------------------------------------------
      # TENANT-SCOPING ASSERTION (tenant + RBAC schema integrity).
      #
      # The guardrails require tenant-scoped migration verification. This runs a
      # dedicated artisan command - `schema:assert-tenant` - which asserts that
      # every tenant/Permission table exists, that `users.institution_id` is
      # present, and that roles are queryable.
      #
      # WHY A COMMAND AND NOT AN INLINE `tinker --execute`:
      #   inline PHP inside a `run:` step depends on shell quoting rules that
      #   differ between bash and PowerShell, so it silently breaks in CI. The
      #   command is plain PHP, runs identically everywhere, and a developer can
      #   reproduce the EXACT CI check locally with `php artisan schema:assert-tenant`.
      #   It exits non-zero on the first failure, failing the job loudly.
      # -----------------------------------------------------------------------
      - name: Assert tenant + RBAC schema integrity
        env:
          DB_CONNECTION: sqlite
        run: php artisan schema:assert-tenant
